<section class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <div class="noticiaForm mb-5">

                <div class="mb-3 row align-items-center">
                    <label for="title" class="col-sm-4 col-form-label text-end"> Titulo: </label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control title" name="title" id="title" [(ngModel)]="nuevaNoticia.title">
                    </div>
                </div>

                <div class="mb-3 row align-items-center">
                    <label for="img" class="col-sm-4 col-form-label text-end"> Imagen URL: </label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control img" name="img" id="img" [(ngModel)]="nuevaNoticia.img">
                    </div>
                </div>

                <div class="mb-3 row align-items-start">
                    <label for="info" class="col-sm-4 col-form-label text-end"> Information: </label>
                    <div class="col-sm-8">
                        <textarea class="form-control info" name="info" id="info" rows="5" [(ngModel)]="nuevaNoticia.info"></textarea>
                    </div>
                </div>

        
                <div class="mb-3 row">
                    <div class="col-sm-8 offset-sm-4">
                        <button class="btn btn-secondary w-100" (click)="publicarNoticia()"> Publicar </button>
                    </div>
                </div>
        
            </div>

            <div class="noticias">
                @for (noticia of noticias; track noticia.title; let i=$index; let par = $even; let impar = $odd) {
                <div class="card w-100 mb-3 shadow-sm">
                    @if (noticia.img) {
                    <img [src]="noticia.img" class="card-img-top" alt="Imagen de la noticia" style="max-height: 300px; object-fit: cover;">
                    }
                    <div class="card-body">
                        <h5 class="card-title">{{ noticia.title }}</h5>
                        <p class="card-text">{{ noticia.info }}</p>
                        @if (noticia.publDate) {
                        <p class="card-text"><small class="text-muted">Publicado el: {{ noticia.publDate|date: 'dd/MM/yyyy' }}</small></p>
                        }
                    </div>
                </div>
                } @empty {
                <p class="text-center text-muted">No hay noticias publicadas.</p>
                }
            </div>
        </div>
    </div>

</section>
