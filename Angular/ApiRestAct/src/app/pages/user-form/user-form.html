<section class="container my-4">
    <h2> {{ isUpdate ? 'Actualizar usuario' : 'Nuevo usuario' }}</h2>
    <hr>
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label for="first_name" class="form-label">Nombre del usuario:</label>
            <input
                id="first_name"
                type="text"
                formControlName="first_name"
                class="form-control"
                placeholder="Introduzca el nombre del usuario"
            >
        </div>

        <div class="mb-3">
            <label for="last_name" class="form-label">Apellido del usuario:</label>
            <input
                id="last_name"
                type="text"
                formControlName="last_name"
                class="form-control"
                placeholder="Introduzca el apellido del usuario"
            >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email del usuario:</label>
            <input
                id="email"
                type="text"
                formControlName="email"
                class="form-control"
                placeholder="Introduzca el email del usuario"
            >
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Imagen del usuario:</label>
            <input
                id="image"
                type="text"
                formControlName="image"
                class="form-control"
                placeholder="Introduzca la imagen del usuario"
            >
        </div>

        <button type="submit" class="btn btn-primary me-2">
            {{ isUpdate ? 'Actualizar' : 'Guardar' }}
        </button>
    </form>
    
</section>
