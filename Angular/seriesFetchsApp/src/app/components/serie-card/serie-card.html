<section>
    <div class="card mb-3 p-1">
        <div class="row g-0">
            <div class="col-md-4">
                <img [src]="miSerie.image" [alt]="miSerie.title" class="img-fluid rounded-start">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title mt-4"> {{ miSerie.title }}</h5>
                    <p class="card-text mt-1">{{ miSerie.channel }}</p>
                    <p class="card-text mt-1">{{ miSerie.rating }}</p>
                    <p class="card-text mt-1"><small class="text-body-secondary">{{ miSerie.creator }}</small></p>
                    <p class="card-text mt-1"><small class="text-body-secondary">{{ miSerie.dates }}</small></p>
                </div>
            </div>

            <button class="btn btn-danger" (click)="deleteSerie(miSerie)">Eliminar</button>
        </div>
    </div>
</section>
