<article class="card h-100 border-0 shadow-sm">
    <img [src]="noticia.imagenURL" class="card-img-top" alt="Imagen noticia">
    <div class="card-body">
        <h3 class="card-title h5 fw-bold">{{noticia.titulo}}</h3>
        <p class="card-text text-secondary">{{noticia.texto}}</p>
        <p class="card-text mb-0">
            <small class="text-body-secondary">{{noticia.fechaPublicacion.toLocaleDateString('es-ES')}}</small>
        </p>
    </div>
</article>
