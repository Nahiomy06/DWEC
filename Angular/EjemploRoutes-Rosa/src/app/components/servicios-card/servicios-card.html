<article class="card">
    <span class="card__dots" aria-hidden="true"></span>
    <svg class="card__star" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 1l2.6 7.4L22 11l-7.4 2.6L12 21l-2.6-7.4L2 11l7.4-2.6z"/>
    </svg>

    <h3 class="card__title">{{ miServicioProf.title }}</h3>

    <svg class="card__squiggle" viewBox="0 0 120 12" fill="none" aria-hidden="true">
        <path
            d="M2 6 Q12 0 22 6 T42 6 T62 6 T82 6 T102 6 T118 6"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
        />
    </svg>

    <p class="card__subtitle">{{ miServicioProf.subtitle }}</p>

    <a class="btn" [routerLink]="['/servicio-profesional', miServicioProf.url]">Ver más</a>
</article>
