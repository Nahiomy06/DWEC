<section class="container m-3">
    <h2>Formulario Tempalte Decroly DAW</h2>
    <div>
        <form action="" class="card shadow mb-7 p-5" #miFormulario="ngForm" (ngSubmit)="getDataForm(miFormulario)">
            <div class="mt-3">
                <label for="nombre" class="form-floating">Nombre</label>
                <input class="form-control" type="text" name="nombre" id="nombre" ngModel>
            </div>
            <div class="mt-3">
                <label for="email" class="form-floating">Email</label>
                <input class="form-control" type="text" name="email" id="email" ngModel>
            </div>
            <div class="mt-3">
                <label for="edad" class="form-floating">Edad</label>
                <input class="form-control" type="number" name="edad" id="edad" ngModel>
            </div>

            <div class="mt-3">
                <label for="cargo" class=form-floating>Cargo</label>
                <select class="form-control" name="cargo" id="cargo">
                    <option value=""> Elije un cargo</option>
                    <option value="CEO"> CEO</option>
                    <option value="Desarollador"> Desarollador</option>

                </select>
            </div>

            <input type="submit" value="enviar" class="btn btn-danger mt-3">
            
        </form>
    </div>
</section>
