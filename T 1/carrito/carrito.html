<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        >
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">agoodshop</a>
                </button>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Carrito</a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="main">
            <section class="productos py-5">
                <div class="container">
                    <div class="mb-4">
                        <h1 class="fw-bold">
                            Productos
                        </h1>
                        <p class="text-muted">
                            Descubre nuestros productos y añade los que quieras a tu carrito.
                        </p>
                    </div>
                    <div id="lista-productos" class="row g-4">
                        <!-- JavaScript generará aquí los productos -->
                    </div>
                </div>
            </section>
            
            <section id="carrito" class="carrito py-5">
                <div class="container">
                    <div class="mb-4">
                        <h2 class="fw-bold">
                            <i class="bi bi-cart3"></i>
                            Tu carrito
                        </h2>
                        <p class="text-muted">
                            Revisa los productos que has seleccionado.
                        </p>
                    </div>
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <div id="productos-carrito">
                                <p class="text-muted">
                                    Todavía no has añadido ningún producto.
                                </p>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-bold fs-5">
                                    Total
                                </span>
                                <span id="total" class="fw-bold fs-4">
                                    0.00 €
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            
        </div>
        <nav class="navbar navbar-expand-lg bg-body-tertiary footer">
            <div class="container-md d-flex justify-content-center">
                <a class="navbar-brand me-0" href="#">©agoodshop</a>
            </div>
        </nav>

    </body>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</html>
