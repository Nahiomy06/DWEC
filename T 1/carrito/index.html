<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        >
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">agoodshop</a>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Carrito</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main -->
        <div class="main container-fluid px-5 py-5">
            <div class="row g-5">
                <section class="col-lg-8 justify-content-between border-bottom pb-2 seccionProductos">
                    <div class="container-md tabla">
                        <span class="h5 fw-bold mb-4">Producto</span>
                        <span class="h5 fw-bold mb-4">Precio</span>
                        <span class="h5 fw-bold mb-4">Cantidad</span>
                        <span class="h5 fw-bold mb-4">Subtotal</span>
                    </div>
                    <div id="listaProductos" class="container-md listaProductos">
                        <!-- Los productos-->
                    </div>

                    <!-- Total-->
                </section>
                <aside class="col-lg-4 seccionTotal">
                    <div class="container-md total">
                        <span class="h5 fw-bold mb-4">Total</span>
                        <span id="total">0€</span>

                        <div id="productosCarrito"></div>
                    </div>
                </aside>
            </div>
        </div>


        <!-- Footer -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary footer">
            <div class="container-md d-flex justify-content-center">
                <a class="navbar-brand me-0" href="#">©agoodshop</a>
            </div>
        </nav>

    </body>
    <script type="module" src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</html>
